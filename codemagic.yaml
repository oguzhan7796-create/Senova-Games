# BlockMir iOS — Codemagic
# Repo: oguzhan7796-create/Senova-Games
#
# Codemagic panelinde (bir kez):
# 1. Team settings -> codemagic.yaml settings -> ON
# 2. iOS code signing -> com.blockmir.game (App Store)
# 3. Team integrations -> Developer Portal -> API key adi: Codemagic
# 4. Build calistir -> IPA otomatik App Store Connect'e yuklenir

workflows:
  blockmir-ios-release:
    name: BlockMir iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blockmir.game
      vars:
        XCODE_PROJECT: BlockMir.xcodeproj
        XCODE_SCHEME: BlockMir
        BUNDLE_ID: com.blockmir.game
      xcode: latest
    scripts:
      - name: www kontrol
        script: |
          if [ ! -f "BlockMir/www/index.html" ]; then
            echo "HATA: BlockMir/www/index.html yok"
            exit 1
          fi
          if [ ! -f "BlockMir/www/game.js" ]; then
            echo "HATA: BlockMir/www/game.js yok"
            exit 1
          fi
          for f in mir-soft.jpg menu-mascot.png icon-512.png senova-splash-fullscreen.png; do
            if [ ! -f "BlockMir/www/assets/$f" ]; then
              echo "HATA: BlockMir/www/assets/$f yok"
              exit 1
            fi
          done
          echo "www OK"
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles --project BlockMir.xcodeproj --archive-method app-store
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/BlockMir.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
