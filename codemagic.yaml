# BlockMir iOS — Codemagic
# Repo: oguzhan7796-create/Senova-Games
#
# Codemagic panelinde (bir kez):
# 1. Team settings -> codemagic.yaml settings -> ON
# 2. iOS code signing -> com.blockmir.game (App Store)
# 3. Build calistir -> IPA indir veya Transporter ile yukle
#
# TestFlight otomatik yukleme icin sonra App Store Connect API key eklenir.

workflows:
  blockmir-ios-release:
    name: BlockMir iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blockmir.game
      vars:
        XCODE_PROJECT: BlockMir.xcodeproj
        XCODE_SCHEME: BlockMir
        BUNDLE_ID: com.blockmir.game
      xcode: latest
    scripts:
      - name: www kontrol
        script: |
          if [ ! -f "BlockMir/www/index.html" ]; then
            echo "HATA: BlockMir/www/index.html yok"
            exit 1
          fi
          if [ ! -f "BlockMir/www/game.js" ]; then
            echo "HATA: BlockMir/www/game.js yok"
            exit 1
          fi
          echo "www OK"
      - name: Xcode archive
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BlockMir.xcarchive \
            archive
      - name: IPA export
        script: |
          xcodebuild -exportArchive \
            -archivePath build/BlockMir.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ios
          ls -la build/ios/
    artifacts:
      - build/ios/*.ipa
      - build/BlockMir.xcarchive
