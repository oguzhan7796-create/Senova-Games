# BlockMir iOS — Codemagic
# Repo: oguzhan7796-create/Senova-Games
#
# Codemagic panelinde (bir kez):
# 1. Team settings -> codemagic.yaml settings -> ON
# 2. iOS code signing -> production sertifika + App Store profil (com.blockmir.game)
# 3. Team integrations -> Developer Portal -> API key adi: Codemagic
# 4. Start new build -> IPA App Store Connect'e yuklenir

workflows:
  blockmir-ios-release:
    name: BlockMir iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blockmir.game
      vars:
        XCODE_PROJECT: BlockMir.xcodeproj
        XCODE_SCHEME: BlockMir
        BUNDLE_ID: com.blockmir.game
      xcode: latest
    scripts:
      - name: www kontrol
        script: |
          if [ ! -f "BlockMir/www/index.html" ]; then
            echo "HATA: BlockMir/www/index.html yok"
            exit 1
          fi
          if [ ! -f "BlockMir/www/game.js" ]; then
            echo "HATA: BlockMir/www/game.js yok"
            exit 1
          fi
          for f in mir-soft.jpg menu-mascot.png icon-512.png senova-splash-fullscreen.png; do
            if [ ! -f "BlockMir/www/assets/$f" ]; then
              echo "HATA: BlockMir/www/assets/$f yok"
              exit 1
            fi
          done
          echo "www OK"
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles --project BlockMir.xcodeproj --archive-method app-store
      - name: Build ipa for distribution
        script: |
          set -o pipefail
          if ! xcode-project build-ipa \
            --project "$CM_BUILD_DIR/BlockMir.xcodeproj" \
            --scheme "$XCODE_SCHEME"; then
            echo "===== xcodebuild log tail ====="
            latest_log=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n 1 || true)
            if [ -n "$latest_log" ]; then
              echo "LOG: $latest_log"
              grep -E "error:|warning:|Provisioning|entitlement|Game Center|GAME_CENTER|CodeSign|ARCHIVE FAILED|BUILD FAILED" "$latest_log" | tail -n 80 || true
              echo "===== last 120 lines ====="
              tail -n 120 "$latest_log" || true
            else
              echo "No /tmp/xcodebuild_logs found"
              ls -la /tmp/xcodebuild_logs 2>/dev/null || true
            fi
            exit 65
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
